<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="pc-versao" content="c7efdfcd0547" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prepacoin — Verificar comprovativo</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#EBFF78" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" />
  <link rel="stylesheet" href="web/biblioteca/prepacoin.css?v=7f775de2" />
  <script src="web/atualizar.js?v=b807cf58"></script>
  <style>
    /* Esta página é pública: não leva rail nem sessão. Quem chega aqui
       vem de um código que alguém lhe deu, e só quer saber se é
       verdadeiro. Por isso o ecrã é uma coisa só, centrada. */
    .publica { max-width: 560px; margin: 0 auto; padding: var(--pc-e7) var(--pc-e4); }
    .publica-topo { text-align: center; margin-bottom: var(--pc-e6); }
    .publica-marca {
      width: 60px; height: 60px; border-radius: var(--pc-r-painel);
      margin: 0 auto var(--pc-e4);
    }
    #codigo { text-transform: uppercase; letter-spacing: 3px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="publica">
    <div class="publica-topo">
      <div class="marca-pp publica-marca" aria-hidden="true"></div>
      <h1>Verificar comprovativo</h1>
      <p class="suave" style="margin-top:var(--pc-e2)">
        Qualquer pessoa pode conferir um comprovativo aqui, sem entrar na conta.
        Dos IBAN só se mostram os últimos quatro dígitos.
      </p>
    </div>

    <form id="form-verificar" class="painel">
      <label for="codigo">Código de autenticação</label>
      <input id="codigo" class="mono" placeholder="A2E4FC7DA05A" maxlength="12"
             autocomplete="off" spellcheck="false" required />
      <p class="ajuda">São 12 caracteres, e vêm no comprovativo da transferência.</p>
      <button type="submit" style="width:100%; margin-top:var(--pc-e4)">
        <span class="icone i-escudo"></span>Verificar
      </button>
      <p class="msg" id="msg-verificar"></p>
    </form>

    <div id="resultado" class="painel" style="margin-top:var(--pc-e4)" hidden>
      <div class="selo">
        <div class="selo-icone"><span class="icone icone-24 i-escudo"></span></div>
        <div class="selo-titulo" id="v-titulo">—</div>
        <div class="selo-subtitulo" id="v-subtitulo">—</div>
        <div class="selo-grade">
          <div class="selo-campo"><div class="rotulo">Valor</div><div class="valor numero" id="v-valor">—</div></div>
          <div class="selo-campo"><div class="rotulo">Categoria</div><div class="valor" id="v-categoria">—</div></div>
          <div class="selo-campo"><div class="rotulo">Data</div><div class="valor" id="v-data">—</div></div>
          <div class="selo-campo"><div class="rotulo">Contas</div><div class="valor mono" id="v-contas">—</div></div>
        </div>
      </div>
    </div>

    <p class="centro" style="margin-top:var(--pc-e6)">
      <a href="index.html" class="fantasma">Entrar no Prepacoin</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="web/comum-banco.js?v=833d295f"></script>
  <script src="web/tema.js?v=80d06e5f"></script>
  <script src="comprovante.js?v=c02eacea"></script>
</body>
</html>
