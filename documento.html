  <style>
    /* A folha é uma A4 no ecrã e no papel, e o PDF sai pelo
       "Imprimir → Guardar como PDF" do próprio browser: nenhuma
       biblioteca, e o que se vê é o que sai.

       A folha fica branca com tinta preta mesmo no tema escuro. Não é
       esquecimento: um boleto impresso em fundo escuro gasta o toner
       todo e sai ilegível. O tema é do ecrã, o papel é papel. */
    body { background: var(--pc-chao-suave); }
  </style>
</head>
<body>
  <div class="barra-acoes nao-imprimir">
    <a href="boletos.html" class="botao secundario">
      <span class="icone i-seta-esquerda"></span>Voltar
    </a>
    <button type="button" id="btn-imprimir">
      <span class="icone i-exportar"></span>Imprimir ou guardar PDF
    </button>
  </div>

  <div class="folha" id="folha">
    <p class="vazio" id="a-carregar">A carregar…</p>
  </div>
