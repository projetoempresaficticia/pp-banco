<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prepacoin — Transferir</title>
  <link rel="stylesheet" href="web/estilos.css?v=9c21eddd" />
</head>
<body>
  <header>
    <div class="cabecalho-marca">
      <div class="marca-moeda" aria-hidden="true">P$</div>
      <strong>Prepacoin</strong>
    </div>
    <nav>
      <a href="index.html">← A minha conta</a>
      <a href="boletos.html">Boletos</a>
    </nav>
  </header>

  <main>
    <div id="area-login" class="painel" style="max-width:360px">
      <h2>Entrar</h2>
      <form id="form-login">
        <label for="email">Email de login</label>
        <input id="email" type="email" required />
        <label for="senha">Senha</label>
        <input id="senha" type="password" required />
        <button type="submit">Entrar</button>
        <p class="msg" id="msg-login"></p>
      </form>
    </div>

    <div id="area-transferir" hidden>
      <h1>Nova transferência</h1>

      <form id="form-transferir" class="painel">
        <label for="origem">De qual conta sai</label>
        <select id="origem" required></select>
        <p class="msg" id="info-origem"></p>

        <label for="destino">IBAN de destino</label>
        <input id="destino" placeholder="PT50…" required />

        <label for="valor">Valor (P$)</label>
        <input id="valor" inputmode="decimal" placeholder="0,00" required />

        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="venda">Venda</option>
          <option value="salario">Salário</option>
          <option value="imposto">Imposto</option>
          <option value="renda">Renda</option>
          <option value="utilities">Utilities (água, energia…)</option>
          <option value="outro">Outro</option>
        </select>
        <p class="msg" style="color:#7A7A85">
          Salário, imposto, renda e utilities são obrigações: se não houver saldo,
          a empresa fica em incumprimento.
        </p>

        <label for="descricao">Descrição</label>
        <input id="descricao" placeholder="Referência do pagamento" />

        <button type="submit" id="btn-transferir">Transferir</button>
        <p class="msg" id="msg-transferir"></p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="web/comum-banco.js?v=ea63aa24"></script>
  <script src="transferir.js?v=e10e3664"></script>
</body>
</html>
